[project]
name = "nesting-ralphs"
version = "0.1.0"
description = "Nesting Ralphs: a learned critic of agent trajectories for budgeted search, with an independent verifier and TRACE replay"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "openai>=3.35.0",
    "pytest>=9.1.1",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
]
